<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="avatar-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle with Gradient -->
  <circle cx="160" cy="160" r="150" fill="url(#bg-grad)" />

  <!-- Inner Soft Glow -->
  <circle cx="160" cy="160" r="144" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Silhouette / Avatar Graphic -->
  <g filter="url(#shadow)">
    <!-- Shoulders / Torso -->
    <path d="M70,285 C70,225 105,210 160,210 C215,210 250,225 250,285 Z" fill="url(#avatar-shirt)" />

    <!-- Neck -->
    <rect x="142" y="170" width="36" height="45" rx="8" fill="#fcd34d" />

    <!-- Head / Face -->
    <ellipse cx="160" cy="135" rx="46" ry="54" fill="#fcd34d" />

    <!-- Hair -->
    <path d="M112,130 C110,85 140,65 170,65 C205,65 214,88 208,125 C202,100 185,90 155,90 C130,90 118,105 112,130 Z" fill="#1e1b4b" />

    <!-- Modern Glasses -->
    <rect x="126" y="125" width="28" height="18" rx="5" fill="none" stroke="#1e1b4b" stroke-width="3.5" />
    <rect x="166" y="125" width="28" height="18" rx="5" fill="none" stroke="#1e1b4b" stroke-width="3.5" />
    <line x1="154" y1="134" x2="166" y2="134" stroke="#1e1b4b" stroke-width="3.5" />

    <!-- Smile -->
    <path d="M148,162 Q160,170 172,162" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />

    <!-- Collar accent -->
    <path d="M145,210 L160,228 L175,210 Z" fill="#ffffff" />
  </g>

  <!-- Code Badge Icon Floating -->
  <g transform="translate(210, 210)">
    <circle cx="25" cy="25" r="24" fill="#10b981" stroke="#ffffff" stroke-width="3" />
    <path d="M18,25 L23,20 M18,25 L23,30 M32,25 L27,20 M32,25 L27,30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
