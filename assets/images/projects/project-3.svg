<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="kanban-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#kanban-bg)" />

  <!-- App Window Frame -->
  <rect x="24" y="24" width="552" height="312" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5" />

  <!-- Header Bar -->
  <rect x="24" y="24" width="552" height="42" rx="12" fill="#030712" />
  <circle cx="48" cy="45" r="5" fill="#ef4444" />
  <circle cx="64" cy="45" r="5" fill="#f59e0b" />
  <circle cx="80" cy="45" r="5" fill="#10b981" />
  <text x="110" y="49" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">FlowDesk • Sprint Backlog &amp; Kanban</text>

  <!-- Column 1: To Do -->
  <g transform="translate(44, 80)">
    <rect width="160" height="236" rx="8" fill="#1f2937" fill-opacity="0.6" stroke="#374151" stroke-width="1" />
    <text x="14" y="24" fill="#9ca3af" font-family="sans-serif" font-size="12" font-weight="600">TO DO (3)</text>
    <circle cx="140" cy="20" r="3" fill="#6b7280" />

    <!-- Card 1 -->
    <rect x="10" y="36" width="140" height="56" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <rect x="18" y="46" width="40" height="12" rx="3" fill="#3b82f6" fill-opacity="0.2" />
    <text x="22" y="55" fill="#60a5fa" font-family="sans-serif" font-size="9" font-weight="bold">DESIGN</text>
    <text x="18" y="74" fill="#e5e7eb" font-family="sans-serif" font-size="11" font-weight="500">Design System Tokens</text>

    <!-- Card 2 -->
    <rect x="10" y="100" width="140" height="56" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <rect x="18" y="110" width="34" height="12" rx="3" fill="#ec4899" fill-opacity="0.2" />
    <text x="22" y="119" fill="#f472b6" font-family="sans-serif" font-size="9" font-weight="bold">DOCS</text>
    <text x="18" y="138" fill="#e5e7eb" font-family="sans-serif" font-size="11" font-weight="500">API Documentation</text>
  </g>

  <!-- Column 2: In Progress -->
  <g transform="translate(220, 80)">
    <rect width="160" height="236" rx="8" fill="#1f2937" fill-opacity="0.6" stroke="#374151" stroke-width="1" />
    <text x="14" y="24" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="600">IN PROGRESS (2)</text>
    <circle cx="140" cy="20" r="3" fill="#3b82f6" />

    <!-- Card 1 -->
    <rect x="10" y="36" width="140" height="66" rx="6" fill="#111827" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="18" y="46" width="36" height="12" rx="3" fill="#10b981" fill-opacity="0.2" />
    <text x="22" y="55" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold">CORE</text>
    <text x="18" y="74" fill="#e5e7eb" font-family="sans-serif" font-size="11" font-weight="500">State Persistence</text>
    <rect x="18" y="86" width="124" height="4" rx="2" fill="#374151" />
    <rect x="18" y="86" width="75" height="4" rx="2" fill="#3b82f6" />

    <!-- Card 2 -->
    <rect x="10" y="110" width="140" height="56" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <rect x="18" y="120" width="30" height="12" rx="3" fill="#f59e0b" fill-opacity="0.2" />
    <text x="22" y="129" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="bold">A11Y</text>
    <text x="18" y="148" fill="#e5e7eb" font-family="sans-serif" font-size="11" font-weight="500">Keyboard Trapping</text>
  </g>

  <!-- Column 3: Done -->
  <g transform="translate(396, 80)">
    <rect width="160" height="236" rx="8" fill="#1f2937" fill-opacity="0.6" stroke="#374151" stroke-width="1" />
    <text x="14" y="24" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">DONE (4)</text>
    <circle cx="140" cy="20" r="3" fill="#10b981" />

    <!-- Card 1 -->
    <rect x="10" y="36" width="140" height="56" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <rect x="18" y="46" width="38" height="12" rx="3" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="22" y="55" fill="#a78bfa" font-family="sans-serif" font-size="9" font-weight="bold">SETUP</text>
    <text x="18" y="74" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="500" text-decoration="line-through">Initial Architecture</text>
  </g>
