<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="chart-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#bg1)" />

  <!-- App Window Frame -->
  <rect x="24" y="24" width="552" height="312" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

  <!-- Header Bar -->
  <rect x="24" y="24" width="552" height="42" rx="12" fill="#0f172a" />
  <circle cx="48" cy="45" r="5" fill="#ef4444" />
  <circle cx="64" cy="45" r="5" fill="#f59e0b" />
  <circle cx="80" cy="45" r="5" fill="#10b981" />
  <text x="110" y="49" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">CloudMetrics Dashboard • Live Monitor</text>

  <!-- Top Metric Cards -->
  <rect x="44" y="84" width="156" height="64" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="56" y="104" fill="#64748b" font-family="sans-serif" font-size="11">TOTAL TRAFFIC</text>
  <text x="56" y="132" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">128.4K <tspan fill="#10b981" font-size="12">+14.2%</tspan></text>

  <rect x="222" y="84" width="156" height="64" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="234" y="104" fill="#64748b" font-family="sans-serif" font-size="11">SERVER UPTIME</text>
  <text x="234" y="132" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">99.98%</text>

  <rect x="400" y="84" width="156" height="64" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="412" y="104" fill="#64748b" font-family="sans-serif" font-size="11">RESPONSE TIME</text>
  <text x="412" y="132" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">42 ms</text>

  <!-- Main Chart Section -->
  <rect x="44" y="166" width="334" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="56" y="188" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Network Throughput</text>
  <!-- Chart grid lines -->
  <line x1="56" y1="215" x2="362" y2="215" stroke="#1e293b" stroke-width="1" />
  <line x1="56" y1="255" x2="362" y2="255" stroke="#1e293b" stroke-width="1" />
  <line x1="56" y1="295" x2="362" y2="295" stroke="#1e293b" stroke-width="1" />
  <!-- Area Curve & Line -->
  <path d="M56,280 Q110,230 160,250 T260,200 T362,190 L362,300 L56,300 Z" fill="#38bdf8" fill-opacity="0.15" />
  <path d="M56,280 Q110,230 160,250 T260,200 T362,190" fill="none" stroke="url(#chart-line)" stroke-width="3" stroke-linecap="round" />

  <!-- Bar Breakdown Section -->
  <rect x="400" y="166" width="156" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="412" y="188" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Node Load</text>
  <rect x="420" y="260" width="20" height="45" rx="4" fill="url(#bar-grad)" />
  <rect x="452" y="230" width="20" height="75" rx="4" fill="url(#bar-grad)" />
  <rect x="484" y="210" width="20" height="95" rx="4" fill="url(#bar-grad)" />
  <rect x="516" y="245" width="20" height="60" rx="4" fill="url(#bar-grad)" />
</svg>
