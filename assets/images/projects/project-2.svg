<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="store-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#store-bg)" />

  <!-- App Window Frame -->
  <rect x="24" y="24" width="552" height="312" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />

  <!-- Browser Header -->
  <rect x="24" y="24" width="552" height="42" rx="12" fill="#09090b" />
  <circle cx="48" cy="45" r="5" fill="#ef4444" />
  <circle cx="64" cy="45" r="5" fill="#f59e0b" />
  <circle cx="80" cy="45" r="5" fill="#10b981" />
  <text x="110" y="49" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Aura Commerce • Minimalist Lifestyle Goods</text>

  <!-- Hero Banner inside app -->
  <rect x="44" y="80" width="512" height="70" rx="8" fill="url(#accent-grad)" />
  <text x="64" y="112" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Summer Tech &amp; Minimalist Gear</text>
  <text x="64" y="132" fill="#fed7aa" font-family="sans-serif" font-size="12">Koleksi terkurasi dengan pengiriman cepat dan diskon musiman</text>

  <!-- Product Grid (3 cards) -->
  <!-- Card 1 -->
  <g transform="translate(44, 164)">
    <rect width="156" height="152" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <rect x="12" y="12" width="132" height="74" rx="6" fill="#3f3f46" />
    <!-- Product Graphic (Headphones) -->
    <path d="M60,49 A18,18 0 0,1 96,49 L96,62 A6,6 0 0,1 84,62 L84,49 M60,62 A6,6 0 0,1 72,62 L72,49" fill="none" stroke="#f43f5e" stroke-width="3" />
    <text x="14" y="104" fill="#f4f4f5" font-family="sans-serif" font-size="12" font-weight="600">Wireless Audio Pro</text>
    <text x="14" y="122" fill="#a1a1aa" font-family="sans-serif" font-size="11">Noise Cancelling</text>
    <text x="14" y="142" fill="#fb7185" font-family="sans-serif" font-size="13" font-weight="bold">Rp 1.499.000</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(222, 164)">
    <rect width="156" height="152" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <rect x="12" y="12" width="132" height="74" rx="6" fill="#3f3f46" />
    <!-- Product Graphic (Keyboard) -->
    <rect x="52" y="40" width="52" height="24" rx="3" fill="none" stroke="#38bdf8" stroke-width="2" />
    <line x1="58" y1="46" x2="98" y2="46" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 3" />
    <line x1="58" y1="56" x2="98" y2="56" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 3" />
    <text x="14" y="104" fill="#f4f4f5" font-family="sans-serif" font-size="12" font-weight="600">KeyMech 65%</text>
    <text x="14" y="122" fill="#a1a1aa" font-family="sans-serif" font-size="11">Hot-swappable</text>
    <text x="14" y="142" fill="#fb7185" font-family="sans-serif" font-size="13" font-weight="bold">Rp 899.000</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(400, 164)">
    <rect width="156" height="152" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <rect x="12" y="12" width="132" height="74" rx="6" fill="#3f3f46" />
    <!-- Product Graphic (Smart Watch) -->
    <circle cx="78" cy="49" r="14" fill="none" stroke="#a78bfa" stroke-width="2.5" />
    <rect x="74" y="30" width="8" height="38" rx="2" fill="#a78bfa" fill-opacity="0.4" />
    <text x="14" y="104" fill="#f4f4f5" font-family="sans-serif" font-size="12" font-weight="600">Aura Watch Pulse</text>
    <text x="14" y="122" fill="#a1a1aa" font-family="sans-serif" font-size="11">OLED Display</text>
    <text x="14" y="142" fill="#fb7185" font-family="sans-serif" font-size="13" font-weight="bold">Rp 1.150.000</text>
  </g>
</svg>
